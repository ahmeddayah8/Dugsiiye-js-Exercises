<!doctype html>
<html lang="so">
  <head>
    <meta charset="UTF-8" />
    <title>Color Picker</title>
    <style>
      body {
        font-family: "Times New Roman", serif;
        padding: 30px;
      }

      .picker-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
        font-size: 16px;
      }

      input[type="color"] {
        width: 50px;
        height: 30px;
        border: 1px solid #999;
        cursor: pointer;
      }

      #colorPreview {
        width: 300px;
        height: 220px;
        border: 1px solid #999;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
        margin-bottom: 20px;
      }

      #colorHistory {
        list-style: none;
        padding: 0;
      }

      #colorHistory li {
        padding: 4px 0;
        font-size: 15px;
      }

      #clearHistoryButton {
        margin-top: 10px;
        padding: 6px 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="picker-row">
      <label for="colorPicker">Choose a color:</label>
      <input type="color" id="colorPicker" value="#5500cc" />
    </div>

    <div id="colorPreview">Color Preview</div>

    <h2>Color History</h2>
    <ul id="colorHistory"></ul>
    <button id="clearHistoryButton">Clear History</button>

    <script src="main.js"></script>
  </body>
</html>
